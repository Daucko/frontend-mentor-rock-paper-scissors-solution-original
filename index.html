<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="styles.css" />

    <title>Frontend Mentor | Rock, Paper, Scissors</title>
  </head>
  <body>
    <!-- Shared icon defs -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <g id="icon-rock">
          <path
            d="M50 12 C58 12 64 18 64 25 C71 26 76 33 74 41 C80 45 82 54 77 61 C77 71 68 79 57 79 L43 79 C31 79 22 70 22 58 C22 54 23 51 25 48 C22 39 27 29 36 27 C38 18 44 12 50 12 Z"
          />
        </g>
        <g id="icon-paper">
          <rect x="30" y="46" width="40" height="38" rx="16" />
          <rect
            x="24"
            y="15"
            width="13"
            height="38"
            rx="6.5"
            transform="rotate(-10 30.5 34)"
          />
          <rect x="43.5" y="10" width="13" height="42" rx="6.5" />
          <rect
            x="62"
            y="15"
            width="13"
            height="38"
            rx="6.5"
            transform="rotate(10 68.5 34)"
          />
          <rect
            x="10"
            y="46"
            width="26"
            height="16"
            rx="8"
            transform="rotate(-40 23 54)"
          />
        </g>
        <g id="icon-scissors">
          <rect x="32" y="50" width="36" height="34" rx="15" />
          <rect
            x="30"
            y="14"
            width="14"
            height="46"
            rx="7"
            transform="rotate(-16 37 37)"
          />
          <rect
            x="56"
            y="14"
            width="14"
            height="46"
            rx="7"
            transform="rotate(16 63 37)"
          />
        </g>
      </defs>
    </svg>

    <div class="app">
      <header class="topbar">
        <div class="title-box">
          <h1>Rock<br />Paper<br />Scissors</h1>
        </div>
        <div class="score-box">
          <span class="score-label">SCORE</span>
          <span class="score-value" id="scoreValue">0</span>
        </div>
      </header>

      <main>
        <!-- CHOICE SCREEN -->
        <section class="screen active" id="choiceScreen">
          <div class="choices-wrap">
            <svg
              class="connector"
              viewBox="0 0 100 100"
              preserveAspectRatio="none"
            >
              <line x1="20" y1="16" x2="80" y2="16"></line>
              <line x1="20" y1="16" x2="50" y2="82"></line>
              <line x1="80" y1="16" x2="50" y2="82"></line>
            </svg>

            <button
              class="choice-node"
              data-choice="paper"
              aria-label="Choose paper"
            >
              <span class="disc"
                ><span class="inner"
                  ><svg viewBox="0 0 100 100">
                    <use href="#icon-paper"></use></svg></span
              ></span>
            </button>
            <button
              class="choice-node"
              data-choice="scissors"
              aria-label="Choose scissors"
            >
              <span class="disc"
                ><span class="inner"
                  ><svg viewBox="0 0 100 100">
                    <use href="#icon-scissors"></use></svg></span
              ></span>
            </button>
            <button
              class="choice-node"
              data-choice="rock"
              aria-label="Choose rock"
            >
              <span class="disc"
                ><span class="inner"
                  ><svg viewBox="0 0 100 100">
                    <use href="#icon-rock"></use></svg></span
              ></span>
            </button>
          </div>
        </section>

        <!-- RESULT SCREEN -->
        <section class="screen" id="resultScreen">
          <div class="result-grid">
            <div class="pick-col">
              <p class="pick-label">You picked</p>
              <div class="pick-stage" id="userStage">
                <span class="ring"></span><span class="ring"></span
                ><span class="ring"></span>
                <div class="pick-circle" id="userPick">
                  <span class="inner"><svg viewBox="0 0 100 100"></svg></span>
                </div>
              </div>
            </div>

            <div class="verdict-col" id="verdictCol">
              <h2 class="verdict-text" id="verdictText"></h2>
              <button class="play-again" id="playAgainBtn">Play again</button>
            </div>

            <div class="pick-col house">
              <p class="pick-label">The house picked</p>
              <div class="pick-stage" id="houseStage">
                <span class="ring"></span><span class="ring"></span
                ><span class="ring"></span>
                <div class="pick-circle" id="housePick">
                  <span class="inner"><svg viewBox="0 0 100 100"></svg></span>
                </div>
              </div>
            </div>
          </div>
        </section>
      </main>

      <button class="rules-btn" id="rulesOpenBtn">Rules</button>
      <footer class="attribution">
        Challenge by
        <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a
        >. Coded by <a href="#">Your Name Here</a>.
      </footer>
    </div>

    <!-- RULES MODAL -->
    <div class="modal-overlay" id="rulesModal">
      <div class="modal">
        <button class="modal-close" id="rulesCloseBtn" aria-label="Close rules">
          &times;
        </button>
        <h2>Rules</h2>
        <div class="rules-diagram">
          <svg viewBox="0 0 300 260">
            <defs>
              <marker
                id="arrowhead"
                markerWidth="8"
                markerHeight="8"
                refX="6"
                refY="4"
                orient="auto"
              >
                <path d="M0,0 L8,4 L0,8 Z" fill="#b7bccb"></path>
              </marker>
            </defs>
            <path class="rules-arrow" d="M195 55 L105 55"></path>
            <path class="rules-arrow" d="M95 75 L140 165"></path>
            <path class="rules-arrow" d="M205 75 L160 165"></path>
            <text class="rules-label" x="150" y="42">BEATS</text>
            <text class="rules-label" x="88" y="120">BEATS</text>
            <text class="rules-label" x="212" y="120">BEATS</text>

            <g class="rules-node" transform="translate(60,55)">
              <circle class="ring" r="34"></circle>
              <circle class="inner-disc" r="24"></circle>
              <svg x="-15" y="-15" width="30" height="30" viewBox="0 0 100 100">
                <use href="#icon-paper"></use>
              </svg>
            </g>
            <g class="rules-node" transform="translate(240,55)">
              <circle class="ring" r="34"></circle>
              <circle class="inner-disc" r="24"></circle>
              <svg x="-15" y="-15" width="30" height="30" viewBox="0 0 100 100">
                <use href="#icon-scissors"></use>
              </svg>
            </g>
            <g class="rules-node" transform="translate(150,200)">
              <circle class="ring" r="34"></circle>
              <circle class="inner-disc" r="24"></circle>
              <svg x="-15" y="-15" width="30" height="30" viewBox="0 0 100 100">
                <use href="#icon-rock"></use>
              </svg>
            </g>
          </svg>
        </div>
      </div>
    </div>

    <script src="index.js"></script>
  </body>
</html>

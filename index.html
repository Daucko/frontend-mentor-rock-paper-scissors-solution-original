<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="styles.css" />

    <title>Frontend Mentor | Rock, Paper, Scissors</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Shared icon defs -->

    <div class="app">
      <header class="topbar">
        <div class="title-box">
          <h1>Rock<br />Paper<br />Scissors</h1>
        </div>
        <div class="score-box">
          <span class="score-label">SCORE</span>
          <span class="score-value" id="scoreValue">0</span>
        </div>
      </header>

      <main>
        <!-- CHOICE SCREEN -->
        <section class="screen active" id="choiceScreen">
          <div class="choices-wrap">
            <!-- <svg
              class="connector"
              viewBox="0 0 100 100"
              preserveAspectRatio="none"
            >
              <line x1="20" y1="16" x2="80" y2="16"></line>
              <line x1="20" y1="16" x2="50" y2="82"></line>
              <line x1="80" y1="16" x2="50" y2="82"></line>
            </svg> -->
            <img src="/images/bg-triangle.svg" class="connector" alt="" />

            <button
              class="choice-node"
              data-choice="paper"
              aria-label="Choose paper"
            >
              <span class="disc"
                ><span class="inner">
                  <img src="/images/icon-paper.svg" alt="" /> </span
              ></span>
            </button>
            <button
              class="choice-node"
              data-choice="scissors"
              aria-label="Choose scissors"
            >
              <span class="disc"
                ><span class="inner">
                  <img src="/images/icon-scissors.svg" alt="" /></span
              ></span>
            </button>
            <button
              class="choice-node"
              data-choice="rock"
              aria-label="Choose rock"
            >
              <span class="disc"
                ><span class="inner"
                  ><img src="/images/icon-rock.svg" alt="" /></span
              ></span>
            </button>
          </div>
        </section>

        <!-- RESULT SCREEN -->
        <section class="screen" id="resultScreen">
          <div class="result-grid">
            <div class="pick-col">
              <p class="pick-label">You picked</p>
              <div class="pick-stage" id="userStage">
                <span class="ring"></span><span class="ring"></span
                ><span class="ring"></span>
                <div class="pick-circle" id="userPick">
                  <span class="inner"><svg viewBox="0 0 100 100"></svg></span>
                </div>
              </div>
            </div>

            <div class="verdict-col" id="verdictCol">
              <h2 class="verdict-text" id="verdictText"></h2>
              <button class="play-again" id="playAgainBtn">Play again</button>
            </div>

            <div class="pick-col house">
              <p class="pick-label">The house picked</p>
              <div class="pick-stage" id="houseStage">
                <span class="ring"></span><span class="ring"></span
                ><span class="ring"></span>
                <div class="pick-circle" id="housePick">
                  <span class="inner"><svg viewBox="0 0 100 100"></svg></span>
                </div>
              </div>
            </div>
          </div>
        </section>
      </main>

      <button class="rules-btn" id="rulesOpenBtn">Rules</button>
      <footer class="attribution">
        Challenge by
        <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a
        >. Coded by <a href="#">Your Name Here</a>.
      </footer>
    </div>

    <!-- RULES MODAL -->
    <div class="modal-overlay" id="rulesModal">
      <div class="modal">
        <button class="modal-close" id="rulesCloseBtn" aria-label="Close rules">
          &times;
        </button>
        <h2>Rules</h2>
        <div class="rules-diagram">
          <img src="/images/image-rules.svg" alt="" />
        </div>
      </div>
    </div>

    <script src="index.js"></script>
  </body>
</html>
